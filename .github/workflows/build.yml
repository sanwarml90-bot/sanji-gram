name: Build Sanji Gram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Inject API credentials
        env:
          SG_API_ID: ${{ secrets.API_ID }}
          SG_API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - <<'PY'
          import os, re
          p = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          s = open(p).read()
          s = re.sub(r"public static int APP_ID = \d+;", "public static int APP_ID = " + os.environ["SG_API_ID"] + ";", s)
          s = re.sub(r'public static String APP_HASH = "[^"]*";', 'public static String APP_HASH = "' + os.environ["SG_API_HASH"] + '";', s)
          open(p, "w").write(s)
          print([l.strip() for l in s.splitlines() if "APP_ID =" in l or "APP_HASH =" in l])
          PY

      - name: Build debug APK
        run: |
          ./gradlew :TMessagesProj:assembleAfatDebug --stacktrace
        env:
          ORG_GRADLE_PROJECT_TMessagesProj_APP_ID: ${{ secrets.API_ID }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanji-gram-apk
          path: TMessagesProj/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
