name: Build Sanji Gram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Inject API credentials
        env:
          SG_API_ID: ${{ secrets.API_ID }}
          SG_API_HASH: ${{ secrets.API_HASH }}
        run: |
          FILE=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/public static int APP_ID = [0-9]*;/public static int APP_ID = ${SG_API_ID};/" "$FILE"
          sed -i "s/public static String APP_HASH = \"[^"]*\";/public static String APP_HASH = \"${SG_API_HASH}\";/" "$FILE"
          grep -n "APP_ID\|APP_HASH" "$FILE"

      - name: Build debug APK
        run: |
          ./gradlew :TMessagesProj:assembleAfatDebug --stacktrace
        env:
          ORG_GRADLE_PROJECT_TMessagesProj_APP_ID: ${{ secrets.API_ID }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanji-gram-apk
          path: TMessagesProj/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
